<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Iron 70.3</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1d1830;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;box-shadow:0 0 0 3px #000,0 10px 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
<canvas id="c" width="180" height="320"></canvas>
<script>
(() => {
const W = 180, H = 320, TOP = 22, BOT = 258, PY = 206, PPM = 8, GOAL = 1900;
const MINX = 22, MAXX = 158;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const FONT = '"Press Start 2P", monospace';

function fit() {
  let s = Math.min(innerWidth / W, innerHeight / H);
  if (s >= 2) s = Math.floor(s);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- helpers ---------- */
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function txt(s, x, y, c = '#fff', al = 'left', sz = 8) {
  ctx.font = sz + 'px ' + FONT; ctx.textAlign = al; ctx.textBaseline = 'top';
  ctx.fillStyle = '#2e2445'; ctx.fillText(s, Math.round(x) + 1, Math.round(y) + 1);
  ctx.fillStyle = c; ctx.fillText(s, Math.round(x), Math.round(y));
}
function hash(a, b) { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); }
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function fmt(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t * 10) % 10);
  return m + ':' + String(s).padStart(2, '0') + '.' + d;
}
function fmtLong(t) {
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = Math.floor(t % 60);
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

/* ---------- audio ---------- */
let AC = null, NB = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', vol = .06, slide = 0, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d);
}
function noise(d = .1, vol = .12, freq = 1200) {
  if (!AC) return;
  if (!NB) {
    NB = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate);
    const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  }
  const s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(); s.stop(AC.currentTime + d);
}

/* ---------- state ---------- */
let best = null;
try { best = parseFloat(localStorage.getItem('ironswim_best')) || null; } catch (e) {}
// progresso: quantas etapas estão liberadas (1 = só natação). Concluir uma etapa libera a próxima
let unlocked = 1;
try { unlocked = Math.max(1, Math.min(3, parseInt(localStorage.getItem('iron703_unlocked')) || 1)); } catch (e) {}
function unlockStage(n) {
  if (n <= unlocked) return false;
  unlocked = Math.min(3, n);
  try { localStorage.setItem('iron703_unlocked', String(unlocked)); } catch (e) {}
  return true;
}

let mode = 'menu', cd = 0, T = 0, S, P = [], M = [];
const press = { L: 0, R: 0 };
const BTNS = [
  { k: 'L', x: 5, w: 82, col: '#f39a3c', lt: '#ffc86e', md: '#d8782e', dk: '#a8522a', plate: '#c8662a' },
  { k: 'R', x: 93, w: 82, col: '#3fc0d0', lt: '#94ecea', md: '#2fa0bc', dk: '#246e98', plate: '#2a8cb0' },
];
const CAPS = ['#29c94a', '#f04848', '#ffe23a', '#ff8ad8', '#ffffff', '#9a6bff'];

function newRun() {
  return {
    d: 0, v: 0, x: 90, vx: 0, t: 0,
    last: null, lastT: -1, aL: 0, aR: 1, tL: 0, tR: 1,
    breath: 0, kick: 0, obs: [], next: 9, ck: 100,
    hits: 0, strokes: 0, warn: 0, flash: 0, endT: 0, newBest: false
  };
}
S = newRun();

function msg(t, c = '#fff') { M.push({ t, c, life: 1.6 }); if (M.length > 3) M.shift(); }
function splash(x, y, n, col = '#ffffff') {
  for (let i = 0; i < n; i++) P.push({ x: x + rand(-2, 2), y: y + rand(-2, 2), vx: rand(-14, 14), vy: rand(-18, 4), life: rand(.25, .5), c: col });
}

function start() {
  audio();
  S = newRun(); P = []; M = [];
  mode = 'count'; cd = 3;
  tone(440, .12);
}


// menu principal -> tela de instruções da etapa 1 (natação)
function openSwim() {
  press.L = press.R = .12;
  mode = 'title'; tone(660, .08); tone(990, .12, 'square', .06, 0, .08);
}

/* ---------- actions ---------- */
// cada toque é uma braçada do lado tocado: avança e puxa o nadador para aquele lado
function swim(side) {
  press[side] = .12;
  if (mode !== 'play') return;
  S.lastT = S.t;
  S.last = side;
  S.v = Math.min(16, S.v + 1.1); // mais toques = mais rápido
  const dir = side === 'L' ? -1 : 1;
  S.vx = Math.max(-55, Math.min(55, S.vx + dir * 18));
  if (side === 'L') { S.tL = 1; S.tR = 0; } else { S.tR = 1; S.tL = 0; }
  S.strokes++;
  splash(S.x + dir * 6, PY - 16, 5);
  noise(.09, .1, 1400 + Math.random() * 400);
}

/* ---------- obstacles ---------- */
function spawn(od) {
  const p = od / GOAL;
  const swimmerChance = od < 220 ? .85 : .65 - p * .3;
  const x = rand(MINX + 6, MAXX - 6);
  if (Math.random() < swimmerChance) {
    S.obs.push({ k: 's', od, x, sp: rand(4, 8.5), cap: pick(CAPS), ph: rand(0, 6), hit: 0 });
  } else {
    S.obs.push({ k: 'j', od, x, ph: rand(0, 6), hit: 0 });
    if (p > .4 && Math.random() < .35) S.obs.push({ k: 'j', od: od + rand(1, 3), x: Math.min(MAXX, Math.max(MINX, x + pick([-1, 1]) * rand(18, 30))), ph: rand(0, 6), hit: 0 });
  }
}

function updateObs(dt) {
  while (S.next < S.d + 34 && S.next < GOAL - 25) {
    spawn(S.next);
    const p = S.d / GOAL;
    S.next += S.next < 160 ? rand(4, 8) : rand(8, 18) - p * 4;
  }
  for (const o of S.obs) {
    if (o.k === 's') {
      o.od += o.sp * dt; o.ph += dt * o.sp * 1.1;
      o.x += Math.sin(o.ph * .3) * 4 * dt;
    } else {
      o.ph += dt;
      o.x += Math.sin(o.ph * .8) * 4 * dt;
      o.od += Math.cos(o.ph * .5) * .3 * dt;
    }
    o.x = Math.min(MAXX, Math.max(MINX, o.x));
    if (!o.hit && Math.abs(o.od - S.d) * PPM < 13 && Math.abs(o.x - S.x) < 10) {
      o.hit = 1; S.hits++; S.flash = .3;
      if (o.k === 'j') {
        S.v *= .2;
        msg('AGUA-VIVA! AI!', '#ff8cf4');
        tone(140, .35, 'sawtooth', .08, -80);
      } else {
        S.v *= .3;
        S.vx += S.x < o.x ? -45 : 45;
        msg('LEVOU UM CHUTE!', '#ffcc66');
        noise(.25, .25, 500);
      }
      splash(S.x, PY - 6, 10);
    }
  }
  S.obs = S.obs.filter(o => o.od - S.d > -22 && o.od - S.d < 90);
}

/* ---------- update ---------- */
const PHRASES = ['BOA!', 'RITMO!', 'FOCO!', 'VAMOS!', 'SEGUE!', 'FORTE!'];

function update(dt) {
  T += dt;
  for (const k in press) press[k] = Math.max(0, press[k] - dt);

  if (mode === 'title') {
    S.d += 2.5 * dt; S.kick += dt * 8;
    const ph = (T * 1.6) % 2;
    S.tL = ph < 1 ? 1 : 0; S.tR = 1 - S.tL;
  }
  if (mode === 'count') {
    const prev = Math.ceil(cd);
    cd -= dt;
    if (Math.ceil(cd) !== prev && cd > 0) tone(440, .12);
    if (cd <= 0) { mode = 'play'; tone(880, .4, 'square', .08); msg('VAI! VAI! VAI!', '#ffe23a'); }
  }
  if (mode === 'play') {
    S.t += dt;
    // deslize: arrasto baixo + atrito constante -> desliza rápido e vai freando até parar
    S.v = Math.max(0, S.v - (S.v * .15 + .5) * dt);
    S.vx *= Math.exp(-4 * dt);
    S.x += S.vx * dt;
    S.warn -= dt;
    if (S.x < MINX || S.x > MAXX) {
      S.x = Math.min(MAXX, Math.max(MINX, S.x));
      S.vx = 0; S.v *= 1 - 1.5 * dt;
      if (S.warn <= 0) { msg('SIGA AS BOIAS!', '#ff9a3a'); S.warn = 2.5; }
    }
    S.d += S.v * dt;
    updateObs(dt);

    if (S.d >= S.ck && S.ck < GOAL) {
      const n = S.ck; S.ck += 100;
      msg(n === 1000 ? 'PASSOU DA METADE!' : n === 1800 ? 'ULTIMOS 100m!' : n + 'm ' + pick(PHRASES), '#ffe23a');
      tone(660, .08, 'square', .05); tone(990, .14, 'square', .05, 0, .08);
    }
    if (S.d >= GOAL) {
      S.d = GOAL; mode = 'win'; S.endT = 0;
      S.unlockedNow = unlockStage(2);
      if (!best || S.t < best) { best = S.t; S.newBest = true; try { localStorage.setItem('ironswim_best', String(best)); } catch (e) {} }
      [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'square', .06, 0, i * .14));
    }
  }
  if (mode === 'win') { S.endT += dt; S.v *= Math.exp(-3 * dt); }

  // body animation
  const gliding = mode === 'play' && (S.lastT < 0 || S.t - S.lastT > .6);
  if (gliding) { S.tL = 0; S.tR = 0; } // braços estendidos à frente no deslize
  S.kick += dt * (gliding ? 1.5 : 6 + S.v * 1.2);
  S.aL += (S.tL - S.aL) * Math.min(1, dt * 14);
  S.aR += (S.tR - S.aR) * Math.min(1, dt * 14);
  S.breath = Math.max(0, S.breath - dt);
  S.flash = Math.max(0, S.flash - dt);

  // particles
  const scroll = (mode === 'play' || mode === 'title') ? S.v * PPM : 0;
  for (const p of P) {
    p.x += p.vx * dt; p.y += (p.vy + scroll) * dt; p.life -= dt;
    p.vx *= .92; if (!p.bub) p.vy += 60 * dt;
  }
  if (mode === 'play' && S.v > 3 && Math.random() < S.v * dt * 3) {
    P.push({ x: S.x + rand(-3, 3), y: PY + 13, vx: rand(-4, 4), vy: rand(-2, 6), life: rand(.3, .6), c: '#d8f0ff', bub: 1 });
  }
  P = P.filter(p => p.life > 0);
  for (const m of M) m.life -= dt;
  M = M.filter(m => m.life > 0);
}

/* ---------- palette (estilo isométrico pastel com contorno roxo) ---------- */
const OUT = '#2e2445';
const PAL = {
  w0: '#3fb6cc', wDeep: '#339fbf', wDeep2: '#2b88ad', wShal: '#5ccfd6', wShal2: '#8ae3de',
  wave: '#7ee0e4', waveHi: '#d6f8f3', weed: '#3aa598', weed2: '#2f8f87',
  sand: '#f3c66c', sandLt: '#fadf98', sandDk: '#dca453', sandDot: '#c98d45', wet: '#d9ad62',
  foam: '#ffffff', foam2: '#c9f3f0', shadowSand: 'rgba(160,96,40,.35)',
  leaf: '#5d9e2f', leafLt: '#8cc545', leafDk: '#3b6e24', trunk: '#d8944a', trunkDk: '#a9652f',
};

/* ---------- sprite helpers ---------- */
function disc(cx, cy, r, c) {
  ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.round(Math.sqrt(r * r - dy * dy) - .25);
    ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
  }
}
// lista de retângulos [x,y,w,h,cor] com contorno de 1px em volta da silhueta toda
function spr(list) {
  for (const r of list) R(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2, OUT);
  for (const r of list) R(r[0], r[1], r[2], r[3], r[4]);
}

const JELLY = [
  '..oooo..',
  '.oXXXXo.',
  'oXhhXXXo',
  'oXhXXXXo',
  'oXXXXXdo',
  '.oddddo.',
];
const JC = { o: '#4a2660', X: '#e88ae8', h: '#ffe4ff', d: '#b45cc0' };
const JC_HIT = { o: '#3a2048', X: '#a060a8', h: '#d0a8d8', d: '#7a4088' };
function drawPattern(pat, cols, x, y) {
  for (let r = 0; r < pat.length; r++)
    for (let c = 0; c < pat[r].length; c++) {
      const ch = pat[r][c]; if (cols[ch]) R(x + c, y + r, 1, 1, cols[ch]);
    }
}
function drawJelly(x, y, ph, hit) {
  x = Math.round(x - 4); y = Math.round(y - 4);
  const f = Math.floor(ph * 4) % 2;
  R(x + 2, y + 3, 7, 6, 'rgba(30,70,120,.3)');
  const tc = hit ? '#8a4a90' : '#f5aef0';
  for (let i = 0; i < 4; i++) {
    const tx = x + 1 + i * 2;
    R(tx, y + 6, 1, 1, tc);
    R(tx + ((i + f) % 2), y + 7, 1, 1, tc);
    R(tx, y + 8, 1, 1, tc);
    R(tx + ((i + f + 1) % 2), y + 9, 1, 1, tc);
  }
  drawPattern(JELLY, hit ? JC_HIT : JC, x, y);
}

// up = cor do ombro até o cotovelo (neoprene do Pablo: prata em cima, antebraço preto)
function armRects(L, x, y, dir, a, suit, skin, up) {
  const sx = dir < 0 ? x - 6 : x + 4;
  if (a < .33) { L.push([sx, y - 15, 2, 11, suit], [sx, y - 17, 2, 2, skin]); if (up) L.push([sx, y - 9, 2, 5, up]); }
  else if (a < .66) { L.push([dir < 0 ? x - 12 : x + 4, y - 5, 8, 2, suit], [dir < 0 ? x - 14 : x + 12, y - 5, 2, 2, skin]); if (up) L.push([dir < 0 ? x - 8 : x + 4, y - 5, 4, 2, up]); }
  else { L.push([sx, y - 4, 2, 10, suit], [sx, y + 6, 2, 2, skin]); if (up) L.push([sx, y - 4, 2, 5, up]); }
}
function drawSwimmer(x, y, cap, aL, aR, breath, kick, breathSide = 1, suit = '#231f30', pablo = false) {
  x = Math.round(x); y = Math.round(y);
  const skin = '#eab07a';
  // sombra no fundo
  R(x - 3, y - 7, 10, 22, 'rgba(20,70,120,.28)');
  // espuma em volta do corpo
  const fo = Math.floor(T * 6 + x) % 2;
  R(x - 6, y - 6 + fo, 1, 1, PAL.foam2); R(x + 5, y - 5 - fo, 1, 1, PAL.foam2);
  R(x - 5, y + 4 - fo, 1, 1, PAL.foam2); R(x + 4, y + 5 + fo, 1, 1, PAL.foam2);
  const k = Math.sin(kick) > 0 ? 1 : 0;
  const L = [
    [x - 3, y + 5, 2, 6 + k, suit], [x + 1, y + 5, 2, 7 - k, suit],
    [x - 3, y + 11 + k, 2, 1, skin], [x + 1, y + 12 - k, 2, 1, skin],
    [x - 4, y - 5, 8, 10, suit],
  ];
  const SIL = '#c8cfd9', up = pablo ? SIL : null;
  if (pablo) L.push([x - 4, y - 5, 8, 4, SIL], [x - 3, y + 9 + k, 2, 2, SIL], [x + 1, y + 10 - k, 2, 2, SIL]);
  armRects(L, x, y, -1, aL, suit, skin, up); armRects(L, x, y, 1, aR, suit, skin, up);
  const hx = breath > 0 ? x - 3 + breathSide : x - 3;
  L.push([hx, y - 11, 6, 6, cap]);
  spr(L);
  // detalhes do macacão
  if (pablo) {
    // ombros prata com brilho, zíper nas costas e resto preto
    R(x - 4, y - 5, 1, 4, '#eef1f5'); R(x - 3, y - 5, 6, 1, '#eef1f5'); R(x + 3, y - 4, 1, 3, '#9aa3b2');
    R(x - 1, y - 4, 2, 9, '#34333e'); R(x - 4, y - 1, 1, 6, '#34333e');
  } else {
    R(x - 4, y - 5, 1, 10, '#4a4462'); R(x - 3, y - 5, 6, 1, '#4a4462');
    R(x - 1, y - 2, 2, 5, '#363048');
    R(x - 4, y + 1, 8, 1, '#e8732a');
  }
  // touca: brilho e sombra
  R(hx + 1, y - 10, 2, 1, 'rgba(255,255,255,.7)'); R(hx + 1, y - 9, 1, 1, 'rgba(255,255,255,.4)');
  R(hx, y - 6, 6, 1, 'rgba(0,0,0,.22)');
  if (breath > 0) {
    const fx = breathSide > 0 ? hx + 4 : hx;
    R(fx, y - 10, 2, 4, skin);
    R(fx + (breathSide > 0 ? 1 : 0), y - 7, 1, 1, '#b03030');
  } else {
    R(hx + 1, y - 12, 1, 1, '#5ad0ff'); R(hx + 4, y - 12, 1, 1, '#5ad0ff');
  }
}

/* ---------- cenário ---------- */
function palm(cx, cy, flip = 1) {
  cx = Math.round(cx); cy = Math.round(cy);
  const bx = cx + 7 * flip, by = cy + 22;
  // sombra da copa na areia
  disc(bx + 4 * flip, by + 2, 6, PAL.shadowSand);
  // tronco curvo, anelado
  const pts = [];
  for (let i = 0; i <= 11; i++) {
    const t = i / 11;
    pts.push([Math.round(cx + 7 * flip * (1 - t) * (1 - t)), Math.round(by - 22 * t)]);
  }
  for (const [px, py] of pts) R(px - 2, py - 1, 5, 4, OUT);
  pts.forEach(([px, py], i) => { R(px - 1, py, 3, 2, i % 2 ? PAL.trunk : PAL.trunkDk); R(px - 1, py, 1, 2, i % 2 ? '#eeb36a' : PAL.trunk); });
  // folhas
  const leaves = [-2.75, -2.05, -1.35, -.6, .15, .85, 1.6, 2.35];
  const pass = (fn) => leaves.forEach((a, j) => {
    const Ln = 11 + (j % 2) * 3;
    for (let t = 1; t <= Ln; t++) {
      const px = cx + Math.cos(a) * t, py = cy + Math.sin(a) * t * .75 + (t / Ln) * (t / Ln) * 5;
      fn(px, py, t < Ln * .7 ? 3 : t < Ln ? 2 : 1, a, t, Ln);
    }
  });
  pass((px, py, th) => R(px - th / 2 - 1, py - th / 2 - 1, th + 2, th + 2, OUT));
  pass((px, py, th, a) => R(px - th / 2, py - th / 2, th, th, Math.sin(a) > .3 ? PAL.leafDk : PAL.leaf));
  pass((px, py, th, a, t, Ln) => { if (Math.sin(a) < .3 && t > 2 && t < Ln - 1 && t % 2) R(px, py - 1, 1, 1, PAL.leafLt); });
  // cocos
  disc(cx - 1, cy + 1, 2, OUT); R(cx - 2, cy, 2, 2, '#7a4a22'); R(cx, cy + 1, 2, 2, '#8e5a2a'); R(cx - 2, cy, 1, 1, '#b07a40');
}

function umbrella(cx, cy, r, c1, c2) {
  cx = Math.round(cx); cy = Math.round(cy);
  disc(cx + 3, cy + 3, r, PAL.shadowSand);
  disc(cx, cy, r + 1, OUT);
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.round(Math.sqrt(r * r - dy * dy) - .25);
    for (let dx = -hw; dx <= hw; dx++) {
      const seg = Math.floor((Math.atan2(dy, dx) + Math.PI) / (Math.PI / 4)) % 2;
      let c = seg ? c1 : c2;
      if (dx + dy > r * .6) c = seg ? '#b8302e' : '#d8cfc4';
      R(cx + dx, cy + dy, 1, 1, c);
    }
  }
  R(cx, cy, 1, 1, OUT);
}
function towel(x, y, c1, c2) {
  spr([[x, y, 9, 15, c1]]);
  for (let i = 0; i < 3; i++) R(x, y + 3 + i * 4, 9, 1, c2);
}
function starfish(x, y) {
  drawPattern(['..o..', '.oxo.', 'oxxxo', '.oxo.', 'o.o.o'], { o: '#a8442a', x: '#f27a4a' }, Math.round(x), Math.round(y));
}
function shell(x, y) { R(x, y, 3, 2, '#f6b4c0'); R(x, y + 1, 3, 1, '#d88498'); }

function sandTex(edge, dir, depth, seed) {
  for (let i = 0; i < 70; i++) {
    const px = Math.floor(hash(i, seed) * W), py = Math.round(edge + dir * (5 + hash(i, seed + 1) * depth));
    if (hash(i, seed + 2) < .6) R(px, py, 2, 1, PAL.sandDot); else R(px, py, 1, 1, PAL.sandLt);
  }
}
// água rasa + areia molhada + espuma na linha d'água. dir=+1: areia abaixo da linha
function shoreline(edge, dir) {
  for (let x = 0; x < W; x += 2) {
    const w1 = Math.round(Math.sin(x * .12 + T * 1.5) * 1.5), w2 = Math.round(Math.sin(x * .2 - T * 2 + 1) * 1.2);
    const a = 16 + w1, b = 7 + w2;
    if (dir > 0) { R(x, edge - a, 2, a, PAL.wShal); R(x, edge - b, 2, b, PAL.wShal2); R(x, edge, 2, 4, PAL.wet); }
    else { R(x, edge, 2, a, PAL.wShal); R(x, edge, 2, b, PAL.wShal2); R(x, edge - 4, 2, 4, PAL.wet); }
    const f = Math.round(Math.sin(T * 1.3) * 1.5 + Math.sin(x * .18 + T * 2) * 1.2);
    const fy = edge - dir * f;
    R(x, fy - dir, 2, 1, PAL.foam2);
    R(x, fy, 2, 1, PAL.foam);
    if ((x / 2 + Math.floor(T * 3)) % 5 === 0) R(x, fy - dir * 3, 1, 1, PAL.foam);
  }
}

const syOf = od => PY - (od - S.d) * PPM;

function drawWater() {
  R(0, TOP, W, BOT - TOP, PAL.w0);
  const wp = S.d * PPM;
  // fundo: pedras e algas vistas através da água
  const CH = 48;
  const c0 = Math.floor((wp + PY - BOT) / CH) - 1, c1 = Math.ceil((wp + PY - TOP) / CH) + 2;
  for (let k = c0; k <= c1; k++) {
    const by = PY - (k * CH - wp);
    for (let i = 0; i < 3; i++) {
      const h = hash(k, i + 10);
      if (h > .6) continue;
      const bx = hash(k, i + 20) * W, yy = by - hash(k, i + 30) * CH;
      const r = 4 + Math.floor(hash(k, i + 40) * 7);
      if (h < .3) {
        disc(bx, yy, r, PAL.wDeep);
        disc(bx + r * .5, yy + r * .4, Math.max(2, r - 3), PAL.wDeep2);
        R(bx - r + 2, yy - 1, r, 1, PAL.wDeep2);
      } else {
        disc(bx, yy, r, PAL.weed);
        disc(bx - 2, yy - 1, Math.max(2, r - 3), PAL.weed2);
        for (let j = 0; j < 3; j++) R(bx - 2 + j * 2, yy - r - 2 + (j % 2), 1, 3, PAL.weed);
      }
    }
  }
  // ondinhas (padrão de tiles do mar)
  const cs = 10, WAVE = [0, 0, 1, 2, 2, 1];
  const k0 = Math.floor((wp + PY - BOT) / cs) - 1, k1 = Math.ceil((wp + PY - TOP) / cs) + 1;
  for (let k = k0; k <= k1; k++) {
    const sy = Math.round(PY - (k * cs - wp));
    for (let c = 0; c < 8; c++) {
      const h = hash(k, c);
      if (h < .5) {
        const len = 6 + Math.floor(hash(k, c + 50) * 3) * 6;
        const sx = Math.round(c * 24 + h * 20 + Math.sin(T * 1.2 + k * .9) * 3) - 6;
        for (let i = 0; i < len; i++) R(sx + i, sy + WAVE[i % 6], 1, 1, h < .12 && i % 6 < 2 ? PAL.waveHi : PAL.wave);
      }
      // brilho do sol
      const g = hash(k, c + 90);
      if (g < .05 && Math.sin(T * 3 + k * 1.7 + c) > .4) {
        const gx = Math.round(c * 24 + g * 300) % W, gy = sy + 5;
        R(gx - 1, gy, 3, 1, PAL.waveHi); R(gx, gy - 1, 1, 3, PAL.waveHi); R(gx, gy, 1, 1, '#fff');
      }
    }
  }
}

function drawBuoys() {
  const a = Math.max(0, Math.floor((S.d - 14) / 5) * 5), b = Math.min(GOAL, S.d + 30);
  for (let m = a; m <= b; m += 5) {
    const sy = Math.round(syOf(m));
    if (sy < TOP - 8 || sy > BOT + 8) continue;
    const bob = Math.sin(T * 3 + m) > 0 ? 1 : 0;
    for (const rx of [MINX - 8, MAXX + 7]) {
      // corda com flutuadores
      for (let yy = 4; yy < 40; yy += 4) {
        R(rx, sy - yy - 1, 1, 3, 'rgba(46,36,69,.35)');
        R(rx, sy - yy, 1, 1, (yy / 4) % 2 ? '#f6f0e8' : '#e8504a');
      }
      if (m % 100 === 0 && m > 0 && m < GOAL) {
        R(rx - 5, sy + 4, 11, 1, PAL.foam2);
        disc(rx, sy + bob, 5, OUT);
        disc(rx, sy + bob, 4, '#e8a020');
        disc(rx - 1, sy - 1 + bob, 3, '#ffd84a');
        R(rx - 4, sy + bob + 1, 9, 1, '#e8504a');
        R(rx - 2, sy - 3 + bob, 2, 1, '#fff6c0'); R(rx - 3, sy - 2 + bob, 1, 1, '#fff6c0');

        R(rx + 1, sy + 1 + bob, 1, 1, '#c84a1a');

}

// caiaques de salva-vidas fora das boias
function drawKayaks() {
  for (let m = 150; m < GOAL; m += 300) {
    const sy = Math.round(syOf(m)) + (Math.sin(T * 2 + m) > 0 ? 1 : 0);
    if (sy < TOP - 14 || sy > BOT + 14) continue;
    const x = (m / 300 | 0) % 2 ? 6 : 173;
    R(x - 1, sy - 6, 5, 18, 'rgba(20,70,120,.28)');
    const hull = [];
    for (let i = 0; i < 18; i++) {
      const hw = i < 2 || i > 15 ? 0 : i < 4 || i > 13 ? 1 : 2;
      hull.push([x - hw, sy - 9 + i, hw * 2 + 1, 1, '#f2c230']);
    }
    spr(hull);
    R(x - 1, sy - 5, 1, 10, '#ffe27a');
    R(x - 1, sy - 2, 3, 5, '#d89a20');
    // remador
    const p = Math.sin(T * 4 + m) > 0 ? 1 : -1;
    R(x - 5, sy - 1 + p, 11, 1, OUT); R(x - 6, sy - 2 + p, 2, 3, '#e8504a'); R(x + 5, sy - 2 - p, 2, 3, '#e8504a');

    R(x - 1, sy - 3, 1, 1, '#ff9a8a');
  }
}

  R(x, y + 2, w, h - 4, c);

}

// Pablo pedalando (vista lateral, posição aero). Grade de 40x30 células; a = ângulo do pedivela
function drawBikePablo(ox, oy, s, a) {
  const g = (x, y, w, h, c) => R(ox + Math.round(x) * s, oy + Math.round(y) * s, w * s, h * s, c);
  const line = (x0, y0, x1, y1, th, c, f0 = 0, f1 = 1) => {
    const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2) || 1;
    for (let i = Math.round(n * f0); i <= Math.round(n * f1); i++) g(x0 + (x1 - x0) * i / n - (th - 1) / 2, y0 + (y1 - y0) * i / n - (th - 1) / 2, th, th, c);
  };
  const ring = (cx, cy, r0, r1, c) => {
    for (let dy = -r1; dy <= r1; dy++) for (let dx = -r1; dx <= r1; dx++) {
      const d = Math.sqrt(dx * dx + dy * dy); if (d >= r0 - .5 && d < r1 + .5) g(cx + dx, cy + dy, 1, 1, c);
    }
  };
  const BB = [18, 23], HIP = [15, 11], CR = 3, LEG = 8;
  const leg = (ang, far) => {
    const fx = BB[0] + Math.cos(ang) * CR, fy = BB[1] + Math.sin(ang) * CR;
    const dx = fx - HIP[0], dy = fy - HIP[1], d = Math.min(Math.hypot(dx, dy), LEG * 2 - .05);
    const k = Math.atan2(dy, dx) - Math.acos(d / (2 * LEG));
    const kx = HIP[0] + Math.cos(k) * LEG, ky = HIP[1] + Math.sin(k) * LEG;
    line(BB[0], BB[1], fx, fy, 1, far ? '#55546a' : '#8a8a98');
    line(HIP[0], HIP[1], kx, ky, 3, far ? '#141319' : PC.K, 0, .6);
    line(HIP[0], HIP[1], kx, ky, 3, far ? PC.r : PC.R, .6, .75);
    line(HIP[0], HIP[1], kx, ky, 3, far ? PC.S : PC.s, .75, 1);
    line(kx, ky, fx, fy - 1, 2, far ? PC.S : PC.s, 0, .75);
    line(kx, ky, fx, fy - 1, 2, PC.q, .75, 1);
    g(fx - 1, fy, 4, 1, far ? '#141319' : PC.X); g(fx, fy - 1, 2, 1, far ? '#141319' : PC.X);
  };
  leg(a + Math.PI, 1);
  // rodas: pneu, aro fundo de carbono e raios girando
  for (const cx of [8, 31]) {
    ring(cx, 22, 7, 7, '#17161d'); ring(cx, 22, 5, 6, '#34333e'); ring(cx, 22, 6, 6, '#4a4958');
    for (let k = 0; k < 4; k++) { const sa = a * 2 + k * Math.PI / 2; g(cx + Math.cos(sa) * 3, 22 + Math.sin(sa) * 3, 1, 1, '#8a8a98'); }
    g(cx, 22, 1, 1, '#c8cfd9');
  }
  // quadro
  const F = '#201f28';
  line(8, 22, 18, 23, 1, F); line(15, 13, 8, 22, 1, F); line(18, 23, 15, 12, 2, F);
  line(15, 13, 27, 13, 2, F); line(27, 14, 18, 23, 2, F); line(27, 12, 28, 15, 2, F); line(28, 15, 31, 22, 1, F);
  g(21, 14, 3, 1, PC.R); g(22, 17, 2, 3, PC.R); g(22, 16, 2, 1, '#f2f2f2');
  g(12, 11, 5, 1, '#17161d'); g(27, 11, 3, 1, F); line(29, 11, 34, 10, 1, F); g(29, 12, 3, 1, '#34333e');
  g(BB[0], BB[1], 1, 1, '#c8cfd9');
  // tronco deitado (macaquinho cinza com lateral vermelha)
  line(15, 9, 25, 8, 4, PC.T); line(16, 11, 24, 10, 1, PC.R); line(14, 10, 16, 10, 3, PC.K);
  g(27, 8, 2, 2, PC.S);
  leg(a, 0);
  // braço apoiado no clip: manga, faixa vermelha, pele, tatuagem e relógio
  line(26, 9, 29, 11, 2, PC.T, 0, .35); line(26, 9, 29, 11, 2, PC.R, .35, .55); line(26, 9, 29, 11, 2, PC.s, .55, 1);
  line(29, 11, 33, 9, 2, PC.s); g(31, 10, 1, 1, PC.t); g(32, 9, 1, 2, PC.w); g(34, 8, 2, 2, PC.s);
  // capacete aero com viseira
  g(27, 2, 4, 1, '#201f28'); g(26, 3, 6, 3, '#201f28'); g(24, 4, 2, 2, '#201f28'); g(23, 5, 2, 1, '#201f28');
  g(27, 3, 2, 1, '#f2f2f2'); g(28, 2, 2, 1, '#4a4958');
  g(30, 4, 3, 2, PC.l); g(31, 4, 1, 1, PC.L);
  g(29, 6, 3, 1, PC.s); g(29, 7, 2, 1, PC.S);
}

const STAGES = [['NATACAO', '1,9KM', 1], ['CICLISMO', '90KM', 0], ['CORRIDA', '21,1KM', 0]];
let msel = 0;
function bigTxt(s, x, y, c, sz, hi) {
  ctx.font = sz + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = OUT;
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [-1, 1], [1, 1], [-1, 2], [0, 2], [1, 2], [2, 2]]) ctx.fillText(s, x + dx, y + dy);
  ctx.fillStyle = c; ctx.fillText(s, x, y);
  if (hi) { ctx.save(); ctx.beginPath(); ctx.rect(0, y, W, Math.round(sz * .4)); ctx.clip(); ctx.fillStyle = hi; ctx.fillText(s, x, y); ctx.restore(); }
}

/* fundo estático do menu, renderizado uma vez com dithering ordenado */
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function ditherBand(y0, y1, stops) {
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / (y1 - y0) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(t)), f = t - i;
    for (let x = 0; x < W; x++) R(x, y, 1, 1, f > (BAYER[y & 3][x & 3] + .5) / 16 ? stops[i + 1] : stops[i]);
  }
}
// fundo neutro: azul médio em degradê, foco de luz atrás do Pablo e um piso mais escuro
const MFLOOR = 222;
let MENU_BG = null;
function menuBg() {
  if (MENU_BG) return MENU_BG;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const keep = ctx; ctx = c.getContext('2d');
  ditherBand(0, MFLOOR, ['#2c4279', '#34508c', '#3d5c9a', '#4666a6']);
  // foco de luz pontilhado atrás do personagem
  for (const [r, col, den] of [[78, '#4f70b0', 2], [62, '#4f70b0', 1], [46, '#5a7cbc', 2], [32, '#5a7cbc', 1]]) {
    for (let dy = -r; dy <= r; dy++) {
      const hw = Math.round(Math.sqrt(r * r - dy * dy)), y = 150 + dy;
      if (y >= MFLOOR) break;
      for (let dx = -hw; dx <= hw; dx++) if (den === 1 || ((dx + dy) & 1) === 0) R(W / 2 + dx, y, 1, 1, col);
    }
  }
  ditherBand(MFLOOR, H, ['#263a6c', '#22335f', '#1d2c54']);
  R(0, MFLOOR, W, 1, '#5a7cbc'); R(0, MFLOOR + 1, W, 1, '#1d2c54');
  ctx = keep; MENU_BG = c; return c;
}

function drawMenu() {
  ctx.drawImage(menuBg(), 0, 0);

  // título com brilho na metade de cima
  bigTxt('IRON 70.3', W / 2, 14, '#ff7a1a', 16, '#ffb35a');
  txt('AJUDE O PABLO!', W / 2, 38, '#fff', 'center');

  const GY = 230, s = 3;
  // Pablo da etapa selecionada (células de 3px, sem contorno)
  const shadow = (hw, y) => {
    for (let dy = -2; dy <= 2; dy++) {
      const w = Math.round(hw * Math.sqrt(1 - (dy * dy) / 9));
      for (let dx = -w; dx <= w; dx++) if (Math.abs(dx) < w - 4 || (dx + dy) % 2 === 0) R(W / 2 + dx, y + dy, 1, 1, 'rgba(10,14,36,.55)');
    }
  };
  if (msel === 1) {
    shadow(52, GY);
    drawBikePablo(W / 2 - 20 * s, GY - 30 * s, s, Math.floor(T * 14) % 16 / 16 * Math.PI * 2);
  } else {
    const f = Math.floor(T * 5) % 2;
    const pat = msel === 0 ? P_SWIM : f ? P_RUN_A : P_RUN_B;
    const bob = msel === 0 ? Math.floor(T * 2) % 2 : (Math.floor(T * 10) % 2) * 2;
    shadow(msel ? 20 : 24, GY);
    drawSpr(pat, W / 2 - 10 * s, GY + 1 - pat.length * s - bob, s);
  }
  // setas para trocar de etapa
  if (Math.floor(T * 2) % 2) { txt('<', 5, 150, '#fff'); txt('>', W - 13, 150, '#fff'); }

  // nome da etapa selecionada + trilha das 3 distâncias (cadeado nas bloqueadas)
  const unl = msel < unlocked, open = unl && STAGES[msel][2];
  txt(STAGES[msel][0], W / 2, 238, '#fff', 'center');
  R(20, 263, W - 40, 2, '#141c3c');
  STAGES.forEach(([, dist], i) => {
    const op = i < unlocked;
    const x = 8 + i * 58, y = 256;
    if (i === msel) rrect(x - 2, y - 2, 54, 18, '#fff');
    rrect(x - 1, y - 1, 52, 16, OUT);
    rrect(x, y, 50, 14, op ? '#e8732a' : '#ecd29a');
    if (op) { R(x + 2, y + 1, 46, 1, '#ffb070'); R(x + 2, y + 12, 46, 1, '#c85a22'); }
    else R(x + 2, y + 12, 46, 1, '#d8b878');
    if (op) txt(dist, x + 25, y + 3, '#fff', 'center');
    else lockIcon(x + 22, y + 2, '#8a6a3a');
  });

  // botão iniciar (30% menor; cinza nas etapas bloqueadas ou ainda sem fase)
  const pr = open && (press.L > 0 || press.R > 0) ? 2 : 0, bw = 98, bh = 19, bx = (W - bw) / 2, by = 284;
  if (open && Math.floor(T * 2.5) % 2) rrect(bx - 3, by - 3 + pr, bw + 6, bh + 9 - pr, '#fff');
  rrect(bx - 1, by - 1 + pr, bw + 2, bh + 5 - pr, OUT);
  rrect(bx, by + 3, bw, bh, open ? '#1f7a3a' : '#5a5470');
  rrect(bx, by + pr, bw, bh, open ? '#3cc45a' : '#8a84a0');
  R(bx + 3, by + 1 + pr, bw - 6, 1, open ? '#8cf09a' : '#aaa4c0'); R(bx + 1, by + 3 + pr, 1, bh - 7, open ? '#8cf09a' : '#aaa4c0');
  R(bx + 3, by + bh - 2 + pr, bw - 6, 1, open ? '#2a9e48' : '#746e8c');
  if (open) txt('INICIAR', W / 2, by + 6 + pr, '#fff', 'center');
  else if (unl) txt('EM BREVE', W / 2, by + 6, '#f0ecfa', 'center');
  else { lockIcon(bx + 8, by + 5, '#f0ecfa'); txt('BLOQUEADA', W / 2 + 6, by + 6, '#f0ecfa', 'center'); }
}
// cadeado de 7x9 px
function lockIcon(x, y, c) {
  R(x + 2, y, 3, 1, c); R(x + 1, y + 1, 1, 3, c); R(x + 5, y + 1, 1, 3, c);
  R(x, y + 4, 7, 5, c); R(x + 3, y + 5, 1, 2, OUT);
}
// toque no menu: pílulas escolhem a etapa, botão inicia, laterais trocam de etapa
function menuTap(x, y) {
  if (y >= 280) { if (msel < unlocked && STAGES[msel][2]) openSwim(); else tone(160, .15, 'square', .05, -40); return; }
  if (y >= 246) msel = Math.max(0, Math.min(2, Math.floor((x - 8) / 58)));
  else msel = (msel + (x < W / 2 ? 2 : 1)) % 3;
  tone(520, .05, 'square', .04);
}

function draw() {
  if (mode === 'menu') { drawMenu(); return; }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, TOP, W, BOT - TOP); ctx.clip();
  drawWater();
  drawShores();
  drawBuoys();
  drawKayaks();
  for (const o of S.obs) if (o.k === 'j') drawJelly(o.x, syOf(o.od), o.ph, o.hit);
  for (const o of S.obs) if (o.k === 's') {
    const c = (o.ph % 2) < 1;
    drawSwimmer(o.x, syOf(o.od), o.cap, c ? .9 : .1, c ? .1 : .9, 0, o.ph * 3, 1, '#34384a');
  }
  drawSwimmer(S.x, PY, '#ff7a1a', S.aL, S.aR, 0, S.kick, 1, '#201f28', true);
  for (const p of P) R(p.x, p.y, 1, 1, p.c);
  if (S.flash > 0) { ctx.fillStyle = 'rgba(255,40,40,' + S.flash + ')'; ctx.fillRect(0, TOP, W, BOT - TOP); }
  M.forEach((m, i) => { if (m.life > .3 || Math.floor(T * 10) % 2) txt(m.t, W / 2, TOP + 8 + i * 12, m.c, 'center'); });
  ctx.restore();

  drawHUD();
  drawButtons();

  if (mode === 'title') {
    overlay(.62);
    panel(34, 214);
    txt('ETAPA 1', W / 2, 44, '#ffe23a', 'center');
    txt('NATACAO', W / 2, 56, '#ff9a1a', 'center', 16);
    txt('1,9 KM', W / 2, 75, '#3fd0ff', 'center');
    const lines = [
      ['Ajude o Pablo a', '#fff'],
      ['nadar a prova!', '#fff'],
      ['', ''],
      ['Toque ESQ e DIR', '#ffb070'],
      ['p/ dar bracadas', '#ffb070'],
      ['Mais toques = mais', '#7fe39a'],
      ['rapido!', '#7fe39a'],
      ['So de um lado', '#5ad0ff'],
      ['vira p/ ele', '#5ad0ff'],
      ['Desvie de aguas-', '#ff8cf4'],
      ['vivas e atletas', '#ff8cf4'],
      ['Teclado: setas', '#8aa'],
    ];
    lines.forEach((l, i) => l[0] && txt(l[0], W / 2, 92 + i * 11, l[1], 'center'));
    if (best) txt('RECORDE ' + fmt(best), W / 2, 228, '#9f9', 'center');
    if (Math.floor(T * 2) % 2) txt('TOQUE P/ COMECAR', W / 2, 262 - 26, '#fff', 'center');
  }
  if (mode === 'count') {
    overlay(.35);
    const n = Math.ceil(cd);
    txt(String(n), W / 2, 110, '#ffe23a', 'center', 32);
    txt('PREPARE-SE', W / 2, 152, '#fff', 'center');
  }
  if (mode === 'win') {
    overlay(Math.min(.75, S.endT));
    if (S.endT > .5) {
      panel(46, 176);
      txt('SAIU DA AGUA!', W / 2, 58, '#ffd21a', 'center');
      txt('1,9 KM', W / 2, 74, '#3fd0ff', 'center', 16);
      txt('TEMPO', W / 2, 100, '#9fb8e0', 'center');
      txt(fmt(S.t), W / 2, 112, '#fff', 'center', 16);
      txt('Equiv. prova real', W / 2, 136, '#9fb8e0', 'center');
      txt('~' + fmtLong(S.t * 12.6), W / 2, 148, '#fff', 'center');
      txt('Bracadas ' + S.strokes, W / 2, 166, '#cfe3ff', 'center');
      txt('Batidas ' + S.hits, W / 2, 178, '#cfe3ff', 'center');
      if (S.newBest) txt('NOVO RECORDE!', W / 2, 196, '#9f9', 'center');
      else if (best) txt('Recorde ' + fmt(best), W / 2, 196, '#9f9', 'center');
      if (S.unlockedNow) txt('CICLISMO LIBERADO!', W / 2, 208, '#ffe23a', 'center');
      if (S.endT > 1 && Math.floor(T * 2) % 2) txt('TOQUE P/ CONTINUAR', W / 2, 232, '#fff', 'center');
    }
  }
}

/* ---------- input ---------- */
function canRestart() { return mode === 'title' || (mode === 'win' && S.endT > 1); }
// título (instruções) -> começa a etapa; fim da etapa -> volta ao menu já na próxima etapa
function advance() {
  if (mode === 'win') { mode = 'menu'; msel = 1; S = newRun(); P = []; M = []; tone(660, .08); }
  else start();
}
function btnAt(x, y) {
  if (y < TOP) return null;
  return x < W / 2 ? 'L' : 'R'; // metade esquerda/direita da tela (água ou botões)
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const r = cv.getBoundingClientRect();
  if (mode === 'menu') { menuTap((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height); return; }
  if (canRestart()) { advance(); return; }
  const k = btnAt((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  if (k) swim(k);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
const KEYS = ['arrowleft', 'arrowright', ' ', 'a', 'd', 'enter'];
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYS.includes(k)) e.preventDefault();
  if (e.repeat) return;
  audio();
  if (mode === 'menu') {
    if (k === 'arrowleft' || k === 'a') menuTap(0, 100);
    else if (k === 'arrowright' || k === 'd') menuTap(W, 100);
    else if (k === ' ' || k === 'enter') menuTap(W / 2, 290);
    return;
  }
  if (canRestart() && (k === ' ' || k === 'enter' || k === 'arrowleft' || k === 'arrowright')) { advance(); return; }
  if (k === 'arrowleft' || k === 'a') swim('L');
  else if (k === 'arrowright' || k === 'd') swim('R');
});

/* ---------- loop ---------- */
let lastTs = 0;
function loop(ts) {
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
const go = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').then(go, go); else go();
})();
</script>
